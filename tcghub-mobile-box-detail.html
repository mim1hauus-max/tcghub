<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCG Hub — 박스 상세 (Mobile)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --brand: #19DFDF;
  --brand-subtle: #CFFAFA;
  --brand-text: #066666;
  --pk-subtle: #FEF9C3;
  --pk: #FFD700;
  --pk-text: #854D0E;
  --bg-page: #F7F6F2;
  --bg-surface: #FFFFFF;
  --bg-muted: #EDECE8;
  --border: #D9D8D3;
  --border-subtle: #EDECE8;
  --text-primary: #0D0D0D;
  --text-secondary: #666560;
  --text-tertiary: #888780;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --font: 'Noto Sans KR', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { max-width: 480px; margin: 0 auto; background: #2C2C2A; }
body { font-family: var(--font); color: var(--text-primary); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { border: none; background: none; cursor: pointer; font-family: var(--font); }

.detail-panel { background: var(--bg-surface); min-height: 100vh; padding-bottom: 70px; position: relative; }

/* 헤더 */
.detail-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--border-subtle);
  position: sticky; top: 0; background: var(--bg-surface); z-index: 10; gap: 10px;
}
.icon-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: var(--text-primary); flex-shrink: 0; }
.icon-btn svg { width: 22px; height: 22px; }
.price-btn {
  display: flex; align-items: center; gap: 5px;
  background: var(--text-secondary); color: white;
  padding: 6px 12px; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 500; white-space: nowrap; flex-shrink: 0;
}
.price-btn svg { width: 16px; height: 16px; }
.header-actions { display: flex; gap: 14px; align-items: center; margin-left: auto; }

/* 메인 정보 */
.main-info { display: flex; gap: 14px; padding: 18px 16px; border-bottom: 1px solid var(--border); }
.main-info-img { width: 64px; height: 86px; border-radius: 8px; background: var(--bg-muted); flex-shrink: 0; }
.main-info-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.brand-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px; background: var(--pk-subtle); width: fit-content; }
.brand-badge-dot { width: 6px; height: 6px; border-radius: 3px; background: var(--pk); }
.brand-badge-text { font-size: 11px; font-weight: 600; color: var(--pk-text); }
.main-info-code { font-size: 13px; color: var(--text-tertiary); }
.main-info-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.main-info-date { font-size: 13px; color: var(--text-tertiary); }

/* 카드 수록 정보 */
.info-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.info-count { font-size: 13px; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
.info-count svg { width: 16px; height: 16px; }
.info-tip { font-size: 11px; color: var(--text-tertiary); }

/* 카드 그리드 (모바일 2열) */
.card-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; padding: 6px 16px 16px; }
.inner-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.inner-card-img { width: 100%; aspect-ratio: 203/285; background: var(--bg-muted); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.inner-card-img svg { width: 24px; height: 24px; color: var(--text-tertiary); opacity: 0.6; }
.inner-card-num { font-size: 12px; color: var(--text-tertiary); text-align: center; }

/* 페이지네이션 */
.pagination-wrap {
  position: fixed; bottom: 0; left: 0; right: 0;
  max-width: 480px; margin: 0 auto;
  background: var(--bg-surface); border-top: 1px solid var(--border-subtle);
  padding: 12px 16px; display: flex; align-items: center; justify-content: center; gap: 4px;
  overflow-x: auto;
}
.page-nav-btn { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); flex-shrink: 0; }
.page-nav-btn svg { width: 18px; height: 18px; }
.page-num { min-width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 13px; font-weight: 500; color: var(--text-secondary); flex-shrink: 0; }
.page-num.active { background: var(--text-tertiary); color: white; }
</style>
</head>
